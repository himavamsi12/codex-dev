<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Dev</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header class="popup-header">
            <img src="logo.png?v=2" alt="" class="logo">
            <div class="popup-header-text">
                <h1>Codex Dev</h1>
                <p class="subtitle">Developer's Insight Tool</p>
            </div>
        </header>

        <nav class="popup-tabs" role="tablist">
            <button class="popup-tab active" data-view="tools" role="tab" aria-selected="true">Tools</button>
            <button class="popup-tab" data-view="launch" role="tab" aria-selected="false">Launch Viewer</button>
        </nav>

        <!-- Tools view -->
        <div class="popup-view active" id="view-tools">
            <div class="tool-list">
                <button class="tool-row" id="toggle-inspector">
                    <span class="tool-icon"><i data-icon="ruler-measure" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">Design Inspector <span class="badge-new">New</span></span>
                        <span class="tool-desc">Guides, spacing, fonts, flexbox, colors and accessibility. Press Alt+Shift+I</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>

                <button class="tool-row" id="toggle-css-viewer">
                    <span class="tool-icon"><i data-icon="pointer" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">Visual Editor</span>
                        <span class="tool-desc">Click, multi-select, nudge &amp; edit any element live</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>

                <button class="tool-row" id="toggle-asset-extractor">
                    <span class="tool-icon"><i data-icon="photo" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">Asset Extractor</span>
                        <span class="tool-desc">Pull every image &amp; font off the page</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>

                <button class="tool-row" id="toggle-seo-tools">
                    <span class="tool-icon"><i data-icon="world-search" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">SEO &amp; Insights</span>
                        <span class="tool-desc">Audit meta tags, headings &amp; structured data</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>

                <button class="tool-row" id="toggle-capture">
                    <span class="tool-icon"><i data-icon="camera" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">Capture <span class="badge-new">New</span></span>
                        <span class="tool-desc">Screenshot: viewport, full page, area or element</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>

                <button class="tool-row" id="toggle-feedback">
                    <span class="tool-icon"><i data-icon="message-circle" data-size="18"></i></span>
                    <span class="tool-copy">
                        <span class="tool-name">Feedback <span class="badge-new">New</span></span>
                        <span class="tool-desc">Pin annotations directly on the page</span>
                    </span>
                    <span class="tool-chevron"><i data-icon="chevron-right"></i></span>
                </button>
            </div>
            <p class="tools-status" id="tools-status" role="alert" hidden></p>
        </div>

        <!-- Launch Viewer view -->
        <div class="popup-view" id="view-launch">
            <section class="quick-launch">
                <h2>Quick Launch</h2>
                <div class="preset-grid">
                    <button class="preset-btn" data-devices='["iPhone 14 Pro", "iPad Air", "Desktop (1920x1080)"]'>
                        <span class="preset-icon"><i data-icon="devices" data-size="18"></i></span>
                        <span class="preset-name">Popular Mix</span>
                        <span class="preset-meta">Phone, tablet, desktop</span>
                    </button>
                    <button class="preset-btn" data-devices='["iPhone 14 Pro", "iPhone SE", "Samsung Galaxy S23"]'>
                        <span class="preset-icon"><i data-icon="device-mobile" data-size="18"></i></span>
                        <span class="preset-name">Mobile Only</span>
                        <span class="preset-meta">3 phones</span>
                    </button>
                    <button class="preset-btn" data-devices='["iPad Pro 12.9\"", "iPad Air", "iPad Mini"]'>
                        <span class="preset-icon"><i data-icon="device-tablet" data-size="18"></i></span>
                        <span class="preset-name">Tablet Only</span>
                        <span class="preset-meta">3 tablets</span>
                    </button>
                    <button class="preset-btn"
                        data-devices='["Laptop (1366x768)", "Desktop (1920x1080)", "Desktop HD (2560x1440)"]'>
                        <span class="preset-icon"><i data-icon="device-desktop" data-size="18"></i></span>
                        <span class="preset-name">Desktop Only</span>
                        <span class="preset-meta">3 screens</span>
                    </button>
                </div>
            </section>

            <section class="device-section">
                <h2>Devices</h2>
                <div class="segmented device-category-tabs" role="tablist">
                    <button class="device-cat-tab active" data-cat="mobile">Mobile</button>
                    <button class="device-cat-tab" data-cat="tablet">Tablets</button>
                    <button class="device-cat-tab" data-cat="desktop">Desktop</button>
                </div>
                <div class="device-list active" id="mobile-devices" data-cat-panel="mobile"></div>
                <div class="device-list" id="tablet-devices" data-cat-panel="tablet"></div>
                <div class="device-list" id="desktop-devices" data-cat-panel="desktop"></div>
            </section>

            <section class="custom-section">
                <h2>Custom Size</h2>
                <div class="custom-inputs">
                    <div class="input-group">
                        <label for="custom-width">Width</label>
                        <input type="number" id="custom-width" placeholder="1920" min="320" max="7680">
                    </div>
                    <div class="input-group">
                        <label for="custom-height">Height</label>
                        <input type="number" id="custom-height" placeholder="1080" min="320" max="4320">
                    </div>
                    <p class="field-error" id="custom-error" role="alert" hidden>Enter a width and height of at least 320px.</p>
                    <button class="custom-btn" id="launch-custom">Launch</button>
                </div>
            </section>

            <p class="view-hint">Select devices to view simultaneously</p>
        </div>

        <!-- Capture sheet (opened from the Capture tool) -->
        <div class="sheet" id="capture-panel" hidden>
            <div class="sheet-header">
                <button class="icon-btn" id="cap-close" aria-label="Back"><i data-icon="x"></i></button>
                <h2>Capture Screenshot</h2>
            </div>

            <div class="sheet-group">
                <span class="group-label">Format</span>
                <div class="segmented" role="radiogroup" aria-label="Image format">
                    <button class="fmt-btn active" data-fmt="png" role="radio" aria-checked="true">PNG</button>
                    <button class="fmt-btn" data-fmt="jpeg" role="radio" aria-checked="false">JPEG</button>
                    <button class="fmt-btn" data-fmt="webp" role="radio" aria-checked="false">WEBP</button>
                </div>
            </div>

            <div class="sheet-group">
                <span class="group-label">Capture Mode</span>
                <div class="tool-list">
                    <button class="tool-row" id="cap-visible">
                        <span class="tool-icon"><i data-icon="device-desktop" data-size="18"></i></span>
                        <span class="tool-copy">
                            <span class="tool-name">Visible Part</span>
                            <span class="tool-desc">Capture what you see right now in the viewport</span>
                        </span>
                    </button>
                    <button class="tool-row" id="cap-fullpage">
                        <span class="tool-icon"><i data-icon="arrow-autofit-height" data-size="18"></i></span>
                        <span class="tool-copy">
                            <span class="tool-name">Full Page</span>
                            <span class="tool-desc">Scroll and stitch the entire page into one image</span>
                        </span>
                    </button>
                    <button class="tool-row" id="cap-area">
                        <span class="tool-icon"><i data-icon="marquee-2" data-size="18"></i></span>
                        <span class="tool-copy">
                            <span class="tool-name">Select Area</span>
                            <span class="tool-desc">Drag to select any region of the page</span>
                        </span>
                    </button>
                    <button class="tool-row" id="cap-element">
                        <span class="tool-icon"><i data-icon="click" data-size="18"></i></span>
                        <span class="tool-copy">
                            <span class="tool-name">Select Element</span>
                            <span class="tool-desc">Click any element on the page to capture it</span>
                        </span>
                    </button>
                </div>
            </div>

            <p class="sheet-status" id="cap-status" role="status"></p>
        </div>
    </div>

    <script src="utils/icons.js"></script>
    <script src="devices.js"></script>
    <script src="popup.js"></script>
</body>

</html>
