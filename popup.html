<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Dev</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header class="popup-header">
            <img src="logo.png?v=2" alt="Codex Dev" class="logo">
            <h1>CODEX DEV</h1>
            <p class="subtitle">Developer's Insight Tool</p>
        </header>

        <div class="content">
            <!-- Tools Section -->
            <section class="tools-section">
                <h2>Tools</h2>
                <div class="preset-grid">
                    <button class="preset-btn" id="toggle-asset-extractor">
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </span>
                        <span class="preset-name">Asset Extractor <span class="badge-new">NEW</span></span>
                    </button>
                    <button class="preset-btn" id="toggle-css-viewer">
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M12 2v2"></path>
                                <path d="M12 20v2"></path>
                                <path d="M2.93 2.93l1.41 1.41"></path>
                                <path d="M19.66 19.66l1.41 1.41"></path>
                                <path d="M2.93 21.07l1.41-1.41"></path>
                                <path d="M19.66 4.34l1.41-1.41"></path>
                            </svg>
                        </span>
                        <span class="preset-name">CSS Viewer</span>
                    </button>
                    <button class="preset-btn" id="toggle-seo-tools">
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                        </span>
                        <span class="preset-name">SEO & Insights</span>
                    </button>
                    <button class="preset-btn" id="toggle-capture">
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </span>
                        <span class="preset-name">Capture <span class="badge-new">NEW</span></span>
                    </button>
                    <button class="preset-btn" id="toggle-feedback">
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </span>
                        <span class="preset-name">Feedback <span class="badge-new">NEW</span></span>
                    </button>
                </div>
            </section>

            <!-- Quick Launch Section -->
            <section class="quick-launch">
                <h2>Quick Launch</h2>
                <div class="preset-grid">
                    <button class="preset-btn" data-devices='["iPhone 14 Pro", "iPad Air", "Desktop (1920x1080)"]'>
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                            </svg>
                        </span>
                        <span class="preset-name">Popular Mix</span>
                    </button>
                    <button class="preset-btn" data-devices='["iPhone 14 Pro", "iPhone SE", "Samsung Galaxy S23"]'>
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                                <line x1="12" y1="18" x2="12.01" y2="18"></line>
                            </svg>
                        </span>
                        <span class="preset-name">Mobile Only</span>
                    </button>
                    <button class="preset-btn" data-devices='["iPad Pro 12.9\"", "iPad Air", "iPad Mini"]'>
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                                <line x1="12" y1="18" x2="12.01" y2="18"></line>
                            </svg>
                        </span>
                        <span class="preset-name">Tablet Only</span>
                    </button>
                    <button class="preset-btn"
                        data-devices='["Laptop (1366x768)", "Desktop (1920x1080)", "Desktop HD (2560x1440)"]'>
                        <span class="preset-icon">
                            <svg class="animated-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                                stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </span>
                        <span class="preset-name">Desktop Only</span>
                    </button>
                </div>
            </section>

            <!-- Device Categories -->
            <section class="device-section">
                <h2>Mobile Devices</h2>
                <div class="device-list" id="mobile-devices"></div>
            </section>

            <section class="device-section">
                <h2>Tablets</h2>
                <div class="device-list" id="tablet-devices"></div>
            </section>

            <section class="device-section">
                <h2>Desktop</h2>
                <div class="device-list" id="desktop-devices"></div>
            </section>

            <!-- Custom Size -->
            <section class="custom-section">
                <h2>Custom Size</h2>
                <div class="custom-inputs">
                    <div class="input-group">
                        <label for="custom-width">Width</label>
                        <input type="number" id="custom-width" placeholder="1920" min="320" max="7680">
                    </div>
                    <div class="input-group">
                        <label for="custom-height">Height</label>
                        <input type="number" id="custom-height" placeholder="1080" min="320" max="4320">
                    </div>
                    <button class="custom-btn" id="launch-custom">
                        <span>Launch</span>
                    </button>
                </div>
            </section>
        </div>

        <footer class="popup-footer">
            <p>💡 Select devices to view simultaneously</p>
        </footer>
    </div>

    <script src="devices.js"></script>
    <script src="popup.js"></script>
</body>

</html>
