<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Dev</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="viewer.css">
</head>

<body>
    <div class="viewer-container">
        <!-- Header Controls -->
        <header class="viewer-header">
            <div class="header-left">
                <div class="brand">
                    <img src="logo.png?v=2" alt="" class="brand-logo">
                    <h1>Codex Dev</h1>
                </div>
                <div class="url-display" id="url-display"></div>
            </div>
            <div class="header-center">
                <div class="zoom-control">
                    <label for="zoom-slider" aria-label="Zoom"><i data-icon="zoom-in"></i></label>
                    <input type="range" id="zoom-slider" min="25" max="100" value="100" step="5">
                    <span id="zoom-value">100%</span>
                </div>
                <div class="user-agent-control">
                    <label for="ua-selector">User Agent</label>
                    <select id="ua-selector" class="ua-selector">
                        <option value="">Default (No Spoofing)</option>
                    </select>
                </div>
            </div>
            <div class="header-right">
                <button class="control-btn has-label" id="add-device" title="Add Device">
                    <i data-icon="plus" data-size="18"></i><span>Add Device</span>
                </button>
                <button class="control-btn" id="toggle-frames" title="Device frames" aria-pressed="true">
                    <i data-icon="frame" data-size="18"></i>
                </button>
                <button class="control-btn" id="refresh-all" title="Refresh All">
                    <i data-icon="refresh" data-size="18"></i>
                </button>
                <button class="control-btn" id="sync-scroll" title="Sync Scroll">
                    <i data-icon="link" data-size="18"></i>
                </button>

                <button class="control-btn" id="screenshot" title="Take Screenshots">
                    <i data-icon="camera" data-size="18"></i>
                </button>
            </div>
        </header>

        <!-- Device Selector Modal -->
        <div class="device-selector-modal" id="device-selector" role="dialog" aria-modal="true" aria-labelledby="picker-title">
            <div class="device-selector-overlay"></div>
            <div class="device-selector-content">
                <div class="device-selector-header">
                    <h3 id="picker-title">Devices</h3>
                    <label class="picker-search">
                        <i data-icon="search"></i>
                        <input type="search" id="device-search" placeholder="Search devices" aria-label="Search devices" autocomplete="off">
                    </label>
                    <button class="modal-close-btn" id="close-modal" aria-label="Close"><i data-icon="x" data-size="18"></i></button>
                </div>
                <div class="picker-current">
                    <span class="picker-label">In this tab</span>
                    <div class="picker-chips" id="picker-current"></div>
                </div>
                <div class="device-categories">
                    <button class="category-btn active" data-category="all">All</button>
                    <button class="category-btn" data-category="mobile"><i data-icon="device-mobile"></i>Phones</button>
                    <button class="category-btn" data-category="tablet"><i data-icon="device-tablet"></i>Tablets</button>
                    <button class="category-btn" data-category="desktop"><i data-icon="device-desktop"></i>Desktop</button>
                    <button class="category-btn" data-category="custom"><i data-icon="adjustments-horizontal"></i>Custom</button>
                </div>
                <div class="custom-device-form" id="custom-device-form" style="display: none;">
                    <h4>Create Custom Device</h4>
                    <div class="custom-inputs">
                        <div class="input-group">
                            <label for="custom-width">Width (px)</label>
                            <input type="number" id="custom-width" placeholder="375" min="100" max="4000">
                        </div>
                        <div class="input-group">
                            <label for="custom-height">Height (px)</label>
                            <input type="number" id="custom-height" placeholder="667" min="100" max="4000">
                        </div>
                        <div class="input-group">
                            <label for="custom-name">Name (optional)</label>
                            <input type="text" id="custom-name" placeholder="My Custom Device">
                        </div>
                        <p class="field-error" id="custom-error" role="alert" hidden>Enter a width and height between 100 and 4000px.</p>
                        <button class="add-custom-btn" id="add-custom-device">Add Custom Device</button>
                    </div>
                </div>
                <div class="device-list-container" id="device-list-container">
                    <div class="device-list" id="device-list"></div>
                </div>
                <div class="picker-footer">
                    <span class="picker-hint">Click a device to add or remove it</span>
                    <button class="add-custom-btn picker-done" id="picker-done">Done</button>
                </div>
            </div>
        </div>

        <!-- Viewports Container -->
        <main class="viewports-container" id="viewports-container">
            <!-- Viewports will be dynamically added here -->
        </main>
    </div>

    <script src="utils/icons.js"></script>
    <script src="utils/codex-ui.js"></script>
    <script src="data/user-agents.js"></script>
    <script src="devices.js"></script>
    <script src="device-frames.js"></script>

    <script src="design-tools.js"></script>
    <script src="performance-tools.js"></script>
    <script src="viewer.js"></script>
    <script src="device-selector.js"></script>
</body>

</html>
