<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; margin: 0; padding: 50px; }
  .host {
    width: 400px; height: 500px; background: #1a202c; border-radius: 12px;
    font-family: sans-serif; box-sizing: border-box; color: #fff; display: flex; flex-direction: column; overflow: hidden;
  }
  .asset-grid {
      flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: flex-start;
  }
  .asset-card {
      background: #2d3748; border: 1px solid #4a5568; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .asset-preview {
      height: 100px; background: #000; display: flex; align-items: center; justify-content: center; position: relative;
  }
</style>
</head>
<body>
  <div class="host">
    <div class="asset-grid">
      <div class="asset-card"><div class="asset-preview"></div></div>
      <div class="asset-card"><div class="asset-preview"></div></div>
    </div>
  </div>
</body>
</html>
