<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Report</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #16171a; background: #f6f6f7; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .cx-icon { flex-shrink: 0; display: inline-block; vertical-align: middle; }
    code, .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }

    @media print {
        body { background: #fff; }
        .cover { page-break-after: always; }
        .no-print { display: none !important; }
        @page { margin: 20mm 15mm; }
    }

    /* Cover */
    .cover { min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
        background: #0e0f11; color: #ececef; padding: 96px 80px 60px; }
    .cover-badge { font-size: 13px; color: #5fd8cc; font-weight: 500; margin-bottom: 20px; }
    .cover-title { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 12px; }
    .cover-url { display: flex; align-items: center; gap: 8px; font-size: 16px; color: #9b9ca4; margin-bottom: 40px; }
    .cover-meta { display: flex; gap: 48px; margin-bottom: 40px; }
    .cover-meta-num { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 36px; font-weight: 600; color: #ececef; line-height: 1; }
    .cover-meta-label { font-size: 12.5px; color: #9b9ca4; margin-top: 6px; }
    .cover-date { font-size: 13px; color: #6e7078; }
    .cover-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 520px; }
    .cover-stat { border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 14px 16px; }
    .cover-stat-num { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 600; }
    .cover-stat-label { font-size: 12px; color: #9b9ca4; margin-top: 2px; }

    /* Content */
    .content { max-width: 820px; margin: 0 auto; padding: 48px 40px; }
    .section-title { font-size: 18px; font-weight: 650; margin-bottom: 24px; }

    .pin-section { background: #fff; border-radius: 10px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(17,18,22,0.09); }
    .pin-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .pin-number { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #0e0f11; flex-shrink: 0; }
    .pin-header-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .severity-badge, .bp-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .bp-badge { background: #f3f3f5; color: #5b5d65; font-weight: 500; }

    .screenshot-wrap { margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(17,18,22,0.09); }
    .screenshot { display: block; width: 100%; height: auto; max-height: 300px; object-fit: contain; background: #f6f6f7; }

    .note-box { margin-bottom: 16px; }
    .note-label { font-size: 12px; font-weight: 600; color: #5b5d65; margin-bottom: 4px; }
    .note-text { font-size: 15px; color: #16171a; line-height: 1.6; }

    .pin-details { display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; padding-top: 14px; border-top: 1px solid rgba(17,18,22,0.08); font-size: 12.5px; }
    .detail-row { display: contents; }
    .detail-key { color: #5b5d65; }
    .detail-val { color: #16171a; font-size: 12px; word-break: break-all; }
    .detail-val.url { color: #0b7a70; }
    .pin-divider { display: none; }

    .print-bar { position: fixed; top: 0; left: 0; right: 0; background: #16171a; border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 10px 24px; display: flex; gap: 16px; align-items: center; z-index: 999; }
    .print-btn { display: inline-flex; align-items: center; gap: 6px; background: #4fd1c5; color: #07201d;
        border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
    .print-btn:hover { background: #6adbd0; }
    .print-title { color: #ececef; font-weight: 600; font-size: 14px; flex: 1; }
    .print-hint { color: #9b9ca4; font-size: 12.5px; }
    .print-bar + .cover { padding-top: 120px; }
    .page-title { font-size: 13px; font-weight: 600; color: #5b5d65; margin: 28px 0 12px; word-break: break-all; }
    .page-title:first-of-type { margin-top: 0; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #e7f6ef; color: #1f8a53; }
    .pin-section.resolved .note-text { text-decoration: line-through; color: #5b5d65; }
    .empty { text-align: center; color: #5b5d65; padding: 80px 20px; }
</style>
</head>
<body>
<div class="print-bar no-print">
    <div class="print-title" id="bar-title">Feedback Report</div>
    <div class="print-hint">Choose "Save as PDF" as the destination</div>
    <button class="print-btn" id="print"><i data-icon="printer"></i>Save as PDF</button>
</div>
<div id="report"></div>
<script src="utils/icons.js"></script>
<script src="feedback-report.js"></script>
</body>
</html>
